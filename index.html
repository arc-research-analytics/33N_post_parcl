<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ECharts Choropleth with Metric Toggle</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2/cdn/shoelace.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2/cdn/themes/light.css"
    />
    <style>
      #controls {
        margin: 1em;
      }
      #chart {
        width: 100%;
        height: 600px;
        position: relative;
        margin-bottom: 2px;
      }

      /* Metric heading text box */
      #metricHeading {
        color: white;
        font-weight: 400;
        padding: 0px;
        font-size: 15px;
        line-height: 1;
        word-wrap: break-word;
        font-family: sans-serif;
        text-align: center;
        margin: 8px auto;
        width: fit-content;
      }
      /* background color */
      body {
        background-color: #5b5b5b;
      }
      /* center align the radio buttons */
      #metricSelector {
        display: flex;
        justify-content: center;
      }

      /* Style Shoelace radio buttons with CSS custom properties */
      sl-radio-button {
        --sl-color-neutral-700: white;
        --sl-color-neutral-600: white;
        --sl-color-neutral-500: white;
        --sl-color-primary-600: #007bff;
      }

      /* Override text color for radio button labels */
      sl-radio-button::part(label) {
        color: white !important;
      }
    </style>
  </head>
  <body>
    <div id="chart"></div>

    <div id="metricHeading"></div>

    <!-- Shoelace UI radio buttons -->
    <sl-radio-group
      label=""
      value="total_listings"
      id="metricSelector"
      size="small"
    >
      <sl-radio-button value="total_listings">All Listings</sl-radio-button>
      <sl-radio-button value="investor_listings"
        >Investor Listings</sl-radio-button
      >
      <sl-radio-button value="median_list_SF">List Price / SF</sl-radio-button>
      <sl-radio-button value="median_vintage"
        >Construction Vintage</sl-radio-button
      >
    </sl-radio-group>

    <script>
      // Initialize chart with debugging
      console.log("Starting ECharts initialization...");
      const chartContainer = document.getElementById("chart");
      console.log("Chart container:", chartContainer);
      console.log(
        "Container dimensions:",
        chartContainer.offsetWidth,
        "x",
        chartContainer.offsetHeight
      );

      const chart = echarts.init(chartContainer);
      console.log("ECharts instance created:", chart);

      let hexGeoJSON, countyGeoJSON, countyLabelsGeoJSON;

      // Configuration object for manual choropleth bins and colors
      const metricConfig = {
        total_listings: {
          bins: [1, 9, 20, 39, 71, 112],
          colors: ["#ffffcc", "#a1dab4", "#41b6c4", "#2c7fb8", "#253494"],
          labels: ["More", "Fewer"],
          tooltipLabel: "Total Listings",
          metricHeading: "Total Regional Listings: <b>21,444</b>",
        },
        investor_listings: {
          bins: [0, 2, 4, 7, 9, 19],
          colors: ["#ffffd4", "#fed98e", "#fe9929", "#d95f0e", "#993404"],
          labels: ["More", "Fewer"],
          tooltipLabel: "Total Investor Listings",
          metricHeading:
            "Total Regional Institutional Investor Listings: <b>1,073</b>",
        },
        median_list_SF: {
          bins: [0, 100, 200, 300, 400, 500],
          colors: ["#edf8e9", "#bae4b3", "#74c476", "#31a354", "#006d2c"],
          labels: ["Higher", "Lower"],
          tooltipLabel: "Median List Price / SF",
          metricHeading: "Regional Median List Price / SF: <b>$189.92</b>",
        },
        median_vintage: {
          bins: [1920, 1970, 1990, 2000, 2015, 2025],
          colors: ["#feebe2", "#fbb4b9", "#f768a1", "#c51b8a", "#7a0177"],
          labels: ["Newer", "Older"],
          tooltipLabel: "Median Construction Year",
          metricHeading: "Regional Median Construction Year: <b>1994</b>",
        },
      };

      // Load all GeoJSONs (using converted versions with consistent CRS)
      console.log("Starting data loading...");
      Promise.all([
        fetch("data/listings_hex_converted.geojson").then((res) => {
          console.log("Hex data fetch response:", res.status, res.statusText);
          if (!res.ok) throw new Error(`Hex data fetch failed: ${res.status}`);
          return res.json();
        }),
        fetch("data/county_overlay_converted.geojson").then((res) => {
          console.log(
            "County data fetch response:",
            res.status,
            res.statusText
          );
          if (!res.ok)
            throw new Error(`County data fetch failed: ${res.status}`);
          return res.json();
        }),
        fetch("data/county-labels.geojson").then((res) => {
          console.log(
            "County labels fetch response:",
            res.status,
            res.statusText
          );
          if (!res.ok)
            throw new Error(`County labels fetch failed: ${res.status}`);
          return res.json();
        }),
      ])
        .then(([hex, counties, countyLabels]) => {
          hexGeoJSON = hex;
          countyGeoJSON = counties;
          countyLabelsGeoJSON = countyLabels;
          echarts.registerMap("HexGrid", hexGeoJSON);
          echarts.registerMap("Counties", countyGeoJSON);

          // Initialize metric heading with default
          const defaultHeading = metricConfig.total_listings.metricHeading;
          const metricHeadingElement = document.getElementById("metricHeading");
          if (metricHeadingElement && defaultHeading) {
            metricHeadingElement.innerHTML = defaultHeading;
          }

          updateChart("total_listings"); // default metric
        })
        .catch((error) => {
          console.error("ERROR loading data:", error);
          alert("Failed to load map data. Check console for details.");
        });

      // Function to update chart by metric
      function updateChart(metric) {
        console.log(`updateChart called with metric: ${metric}`);

        if (!hexGeoJSON || !countyGeoJSON || !countyLabelsGeoJSON) {
          console.error("GeoJSON data not loaded yet");
          return;
        }

        // Build data array from hex GeoJSON
        const data = hexGeoJSON.features.map((f) => ({
          name: f.properties.hex_id,
          value: f.properties[metric] || 0,
        }));

        // Build county labels data array
        const countyLabelsData = countyLabelsGeoJSON.features.map((f) => ({
          name: f.properties.name,
          value: [f.geometry.coordinates[0], f.geometry.coordinates[1]],
        }));

        // Debug: Check data values
        const values = data.map((d) => d.value).filter((v) => v > 0);
        const minVal = Math.min(...values);
        const maxVal = Math.max(...values);
        const range = maxVal - minVal;

        console.log(
          `Metric: ${metric}, Data prepared: ${data.length} items, Values range: ${minVal} - ${maxVal}, Range span: ${range}, Non-zero count: ${values.length}`
        );

        // Get configuration for this metric
        const config = metricConfig[metric];
        if (!config) {
          console.error(`No configuration found for metric: ${metric}`);
          return;
        }

        // Update metric heading text with line breaks for iframe display
        const metricHeadingElement = document.getElementById("metricHeading");
        if (metricHeadingElement && config.metricHeading) {
          // Add line breaks for better iframe display
          let headingText = config.metricHeading;

          metricHeadingElement.innerHTML = headingText;
        }

        const visualMapMin = config.bins[0];
        const visualMapMax = config.bins[config.bins.length - 1];
        console.log(
          `Using configured range: ${visualMapMin} - ${visualMapMax} with ${config.colors.length} colors`
        );

        // Global map view settings - used by both hex and county layers
        const globalZoom = 1.2;
        const globalCenter = [-84.4, 33.83]; // Atlanta area center
        const globalScaleLimit = { min: 0.5, max: 10 };
        const globalRoam = false; // Enable zoom and pan interactions

        // Determine border color based on metric
        const borderColor =
          metric === "total_listings" || metric === "investor_listings"
            ? "#000000"
            : "#ffffff";

        const option = {
          geo: {
            map: "HexGrid",
            show: false, // Hide geo component - let series handle rendering
            zoom: globalZoom,
            center: globalCenter,
            roam: globalRoam,
            scaleLimit: globalScaleLimit,
          },
          tooltip: {
            trigger: "item",
            formatter: function (params) {
              // Only show tooltip for hex data, not county overlay
              if (params.seriesName === "counties") {
                return false;
              }

              // Find the corresponding hexagon feature to get county info
              const hexFeature = hexGeoJSON.features.find(
                (f) => f.properties.hex_id === params.name
              );
              const countyName = hexFeature
                ? hexFeature.properties.County
                : "Unknown";

              // Use the configured tooltip label
              const displayMetric = config.tooltipLabel;

              // Format value based on metric type
              let formattedValue = params.value;
              if (metric === "median_list_SF") {
                const numValue = Number(params.value);
                if (numValue > 500) {
                  formattedValue = "> $500";
                } else {
                  formattedValue = `$${numValue.toFixed(2)}`;
                }
              }

              return `${displayMetric}: ${formattedValue}<br/>${countyName} County`;
            },
          },
          visualMap: {
            left: "right",
            min: visualMapMin,
            max: visualMapMax,
            text: config.labels,
            calculable: true,
            inRange: {
              color: config.colors,
            },
            textStyle: {
              color: "#ffffff",
            },
            show: true,
            formatter: function (value) {
              if (metric === "median_list_SF") {
                const roundedValue = Math.round(value);
                // Show top static legend value as "> $500" to indicate range extends higher
                if (roundedValue === visualMapMax) {
                  return "> $500";
                }
                // Show interactive hover values above $500 as "> $500"
                else if (roundedValue > 500) {
                  return "> $500";
                }
                return `$${roundedValue}`;
              } else if (
                metric === "total_listings" ||
                metric === "investor_listings"
              ) {
                return Math.round(value).toString();
              } else if (metric === "median_vintage") {
                return Math.round(value).toString();
              }
              return value.toString();
            },
          },
          series: [
            // Choropleth hexagons
            {
              name: metric,
              type: "map",
              map: "HexGrid",
              nameProperty: "hex_id",
              data: data,
              zoom: globalZoom,
              center: globalCenter,
              roam: globalRoam,
              scaleLimit: globalScaleLimit,
              itemStyle: {
                borderColor: "#bdbdbd",
                borderWidth: 0.5,
              },
              emphasis: {
                label: { show: false },
                itemStyle: {
                  borderColor: "#000",
                  borderWidth: 2,
                },
              },
              z: 1, // Layer hexagons below counties
            },
            // County overlay
            {
              name: "counties",
              type: "map",
              map: "Counties",
              data: [], // No data, just boundaries
              zoom: globalZoom,
              center: globalCenter,
              scaleLimit: globalScaleLimit,
              itemStyle: {
                areaColor: "transparent",
                borderColor: borderColor,
                borderWidth: 2,
                opacity: 1,
              },
              emphasis: {
                disabled: true, // Disable hover effects
                itemStyle: {
                  areaColor: "transparent",
                },
              },
              tooltip: {
                show: false, // Disable county tooltips
              },
              silent: true, // Disable all interactions
              animation: false,
              z: 10, // Layer counties above hexagons
            },
            // County labels
            {
              name: "countyLabels",
              type: "scatter",
              coordinateSystem: "geo",
              geoIndex: 0,
              data: countyLabelsData,
              symbolSize: 8,
              itemStyle: {
                color: "transparent", // Point markers
              },
              label: {
                show: true,
                formatter: function (params) {
                  return params.name.toUpperCase();
                },
                position: "inside",
                fontSize: 12,
                fontWeight: "bold",
                fontStyle: "italic",
                color: "#000000",
                textBorderColor: "#ffffff",
                textBorderWidth: 3,
                opacity: 0.85,
              },
              emphasis: {
                disabled: true, // Disable hover effects
              },
              tooltip: {
                show: false, // Disable tooltips for labels
              },
              silent: true, // Disable all interactions
              animation: false,
              z: 15, // Layer labels above everything
            },
          ],
        };

        console.log("Setting chart option...", option);
        try {
          chart.setOption(option, true);
          console.log("Chart option set successfully");

          // Check if chart is properly sized and add more debugging
          setTimeout(() => {
            const container = document.getElementById("chart");
            console.log(
              "Final container dimensions:",
              container.offsetWidth,
              "x",
              container.offsetHeight
            );
            if (container.offsetWidth === 0 || container.offsetHeight === 0) {
              console.error(
                "Chart container has zero dimensions! This will prevent the chart from displaying."
              );
            }

            // Debug: Check if we can get chart bounds/viewport info
            try {
              const chartModel = chart.getModel();
              console.log("Chart model available:", !!chartModel);

              // Get geo component info
              const geoModel = chart.getModel().getComponent("geo");
              console.log("Geo model:", geoModel);

              // Try to get coordinate system info
              const coordSys = chart.getModel().getComponent("geo", 0);
              console.log("Coordinate system:", coordSys);
            } catch (e) {
              console.log("Could not get chart view info:", e.message);
            }
          }, 500);
        } catch (error) {
          console.error("Error setting chart option:", error);
        }
      }

      // Hook up radio button change
      document
        .getElementById("metricSelector")
        .addEventListener("sl-change", (e) => {
          updateChart(e.target.value);
        });
    </script>
  </body>
</html>
